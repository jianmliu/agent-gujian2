<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古剑二 · 双人试炼</title>
<style>
  body { margin: 2rem auto; padding: 0 1rem; max-width: 44rem; background: #172320; color: #f4eee1; font: 1rem system-ui; }
  svg { display: block; width: min(100%, 32rem); background: #273d32; border: 1px solid #698873; border-radius: .5rem; }
  button, input { padding: .45rem .7rem; margin: .25rem; font: inherit; }
  text { fill: #fff; font-size: 3px; text-anchor: middle; }
  #notice { min-height: 1.5em; }
</style>
<h1>古剑二 · 双人试炼</h1>
<p><a href="/play3d" style="color:#f5d278">进入双人 3D 试炼</a></p>
<form id="connect">
  <label>玩家凭据 <input id="token" type="password" autocomplete="off" required></label>
  <button id="join">进入</button>
</form>
<p id="notice" role="status"></p>
<main id="world" hidden>
  <p id="identity"></p>
  <svg id="map" viewBox="-32 -32 64 64" role="img" aria-label="双人试炼地图">
    <g id="markers"></g>
  </svg>
  <p id="monster"></p>
  <section aria-label="移动">
    <button id="north">北 ↑</button><button id="south">南 ↓</button>
    <button id="west">西 ←</button><button id="east">东 →</button>
  </section>
  <section id="battle" aria-label="战斗" hidden>
    <p id="battle-info"></p>
    <button id="attack">轻击</button><button id="heavy">重击</button>
    <button id="dodge" type="button">闪避</button><button id="guard">格挡</button>
  </section>
</main>
<script type="module" src="/shared-world-client.js"></script>
</html>
